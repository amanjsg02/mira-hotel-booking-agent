name: Backend Non-AI Tests

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      USE_AI_AGENT: "false"
      DATABASE_PATH: "data/test-agent.db"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Gemini SDK installation
        run: |
          python -c "from google import genai; print('Google Gen AI SDK available')"

      - name: Prepare test database directory
        run: mkdir -p data

      - name: Run deterministic tests
        run: pytest -m "not live_ai" -v --tb=short